name: Generate Shakou Kishin Texture
on:
  push:
    branches: [main]
    paths:
      - "Tools/ShakouKishinTexture/generate.py"
      - ".github/workflows/generate-shakou-kishin.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python Tools/ShakouKishinTexture/generate.py
      - name: Commit generated texture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "カスタムモンスター/シャコウ鬼神.png"
          git commit -m "Generate Shakou Kishin UV texture" || echo "No changes"
          git push
