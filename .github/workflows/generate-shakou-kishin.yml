name: Generate Shakou Kishin texture

on:
  workflow_dispatch:
  push:
    paths:
      - "Tools/ShakouKishinTexture/**"
      - ".github/workflows/generate-shakou-kishin.yml"
      - "カスタムモンスター/普通のいしにんぎょう.png"
      - "カスタムモンスター/シャコウ鬼神正面撮影.png"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Generate texture
        run: python Tools/ShakouKishinTexture/generate.py

      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "カスタムモンスター/シャコウ鬼神.png"
          if git diff --cached --quiet; then
            echo "No texture changes."
          else
            git commit -m "Generate Shakou Kishin texture PNG"
            git push
          fi
