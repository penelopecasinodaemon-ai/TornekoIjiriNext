name: Build TornekoIjiriPort

on:
  push:
    branches: [main]
    paths:
      - "TornekoIjiriPort/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish "TornekoIjiriPort/TornekoIjiriPort.csproj" -c Release -o "publish"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TornekoIjiriPort-Release
          path: publish/
          if-no-files-found: error
